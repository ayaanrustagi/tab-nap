<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1280px;height:800px;overflow:hidden;font-family:"Hanken Grotesk",system-ui,sans-serif;
    background:#042f2e;color:#ecfdf5;display:flex;align-items:center;justify-content:center}
  .popup{width:360px;background:#e6faf6;color:#042f2e;border:2px solid #042f2e;border-radius:18px;
    box-shadow:10px 10px 0 #0f766e;padding:22px;position:relative}
  .eyebrow{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#0f766e}
  h1{font-size:26px;font-weight:900;letter-spacing:-.03em;margin:6px 0 4px}
  .timer{font-size:42px;font-weight:900;color:#0f766e;letter-spacing:-.04em;margin-bottom:14px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:#0f766e;margin-bottom:6px}
  .field input,.field textarea{width:100%;border:1.5px solid #042f2e;border-radius:10px;padding:10px;
    font:600 13px/1.3 inherit;background:#fff}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
  .btn{border:1.5px solid #042f2e;border-radius:999px;padding:12px;font-weight:800;font-size:12px;text-align:center}
  .btn.p{background:#0f766e;color:#fff}
  .btn.g{background:#fff}
  .meta{font-size:12px;font-weight:600;color:#0f766e}
  .float{position:absolute;right:-180px;top:40px;width:200px;background:#0f766e;color:#fff;
    border:2px solid #042f2e;border-radius:14px;padding:16px;box-shadow:6px 6px 0 #042f2e}
  .float b{display:block;font-size:32px;font-weight:900}
  .float span{font-size:12px;opacity:.85}
</style></head>
<body>
  <div class="popup">
    <div class="eyebrow">tab nap</div>
    <h1>Idle minutes</h1>
    <div class="timer">15 min</div>
    <div class="field">
      <label>Whitelist hosts</label>
      <textarea rows="3">mail.google.com
docs.google.com</textarea>
    </div>
    <div class="row">
      <div class="btn p">Save</div>
      <div class="btn g">Wake all</div>
    </div>
    <div class="meta">Pinned &amp; audible tabs never nap.</div>
    <div class="float"><b>7</b><span>napping · free RAM</span></div>
  </div>
</body></html>
