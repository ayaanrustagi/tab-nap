<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:440px;height:280px;overflow:hidden;font-family:"Hanken Grotesk",system-ui,sans-serif}
  .wrap{
    width:440px;height:280px;
    background:linear-gradient(125deg,#042f2e 0%,#0f766e 50%,#5eead4 100%);
    padding:22px 20px 20px 24px;color:#ecfdf5;
    display:flex;flex-direction:column;position:relative;
  }
  h1{
    font-size:34px;font-weight:900;letter-spacing:-.035em;line-height:.95;
    text-transform:uppercase;max-width:250px;
  }
  p{margin-top:10px;font-size:13px;font-weight:600;line-height:1.35;max-width:210px;opacity:.95}
  .pill{
    margin-top:auto;align-self:flex-start;background:#ecfdf5;color:#042f2e;
    border:2px solid #042f2e;border-radius:999px;padding:9px 14px;
    font-weight:900;font-size:11px;box-shadow:0 4px 0 #042f2e;
  }
  .moon{
    position:absolute;right:22px;top:50%;transform:translateY(-50%);
    width:88px;height:88px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#f0fdfa,#5eead4 42%,#0f766e);
    border:2.5px solid #042f2e;box-shadow:5px 5px 0 rgba(4,47,46,.4);
  }
  .zzz{
    position:absolute;right:14px;top:48px;font-weight:900;font-size:13px;color:#042f2e;
    background:#ecfdf5;border:2px solid #042f2e;border-radius:8px;padding:3px 6px;
    transform:rotate(8deg);
  }
</style></head>
<body>
<div class="wrap">
  <h1>Tabs that<br>actually nap</h1>
  <p>Native discard. Free RAM. Wake all.</p>
  <div class="pill">Tab Nap · free</div>
  <div class="moon"></div>
  <div class="zzz">Zzz</div>
</div>
</body></html>
