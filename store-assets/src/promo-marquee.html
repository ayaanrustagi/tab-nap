<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1400px;height:560px;overflow:hidden;font-family:"Hanken Grotesk",system-ui,sans-serif}
  .wrap{width:1400px;height:560px;background:linear-gradient(115deg,#042f2e 0%,#0f766e 48%,#5eead4 100%);
    display:flex;align-items:center;justify-content:space-between;padding:0 90px;color:#ecfdf5}
  h1{font-size:78px;font-weight:900;letter-spacing:-.035em;line-height:.92;text-transform:uppercase;max-width:700px}
  p{margin-top:20px;font-size:22px;font-weight:600;max-width:480px;line-height:1.4;opacity:.92}
  .pill{display:inline-flex;margin-top:28px;background:#ecfdf5;color:#042f2e;border:2px solid #042f2e;
    border-radius:999px;padding:14px 26px;font-weight:900;font-size:16px;box-shadow:0 6px 0 #042f2e}
  .moon{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f0fdfa,#5eead4 40%,#0f766e);
    border:3px solid #042f2e;box-shadow:10px 10px 0 rgba(4,47,46,.45);position:relative}
  .moon:after{content:"Zzz";position:absolute;right:-20px;top:20px;font-weight:900;font-size:28px;color:#042f2e;
    background:#ecfdf5;border:2px solid #042f2e;border-radius:12px;padding:6px 10px;transform:rotate(8deg)}
</style></head>
<body>
<div class="wrap">
  <div>
    <h1>Tabs that<br>actually nap</h1>
    <p>Native discard. Free RAM. Whitelist what matters. Wake everything in one click.</p>
    <div class="pill">Tab Nap · free · Manifest V3</div>
  </div>
  <div class="moon"></div>
</div>
</body></html>
